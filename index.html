<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>血壓紀錄</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    :root {
      --header-bg: #1d4ed8;
      --bg: #eff6ff;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --fab-bg: #bfdbfe;
      --fab-text: #1e3a8a;
      --edit-bg: #eff6ff;
      --edit-border: #bfdbfe;
      --red: #dc2626;
      --green: #10b981;
      --border: #dbeafe;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 92px;
      transition: background-color 0.25s ease;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--header-bg);
      color: #fff;
      padding: 13px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      transition: background-color 0.25s ease;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .sync-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-weight: 400;
    }
    .header-actions { display: flex; gap: 6px; }
    .icon-btn {
      background: rgba(255,255,255,0.18);
      border: none;
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 13px;
      color: #fff;
      cursor: pointer;
    }
    .container { max-width: 640px; margin: 0 auto; padding: 12px; }

    /* 7日統計三張卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: var(--card);
      border-radius: 14px;
      padding: 12px 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .stat-label { font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
    .stat-val {
      font-size: clamp(17px, 5vw, 22px);
      font-weight: 700;
      letter-spacing: -0.5px;
      white-space: nowrap;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .stat-sub {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 6px;
    }
    .chart-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .range-btns { display: flex; gap: 6px; }
    .range-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .range-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    #chart { width: 100%; height: 280px; }

    /* 紀錄列表 */
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .list-title { font-size: 15px; font-weight: 600; }
    .record-item {
      position: relative;
      border-top: 1px solid var(--border);
      padding: 12px 0 12px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .record-item:first-child { border-top: none; }
    .status-bar {
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 4px;
      border-radius: 4px;
      background: var(--primary);
    }
    .status-bar.bar-red { background: var(--red); }
    .status-bar.bar-green { background: var(--green); }
    .status-bar.bar-normal { background: var(--primary); }

    .record-main { flex: 1; min-width: 0; }
    .record-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .record-date { font-size: 14px; font-weight: 600; color: var(--text); }
    .record-bp { font-size: 17px; font-weight: 700; white-space: nowrap; }
    .record-bp small { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 2px; }
    .record-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .record-note {
      font-size: 12px;
      color: #4b5563;
      margin-top: 5px;
      background: var(--bg);
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
    }
    .record-actions { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
    .btn-sm {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-edit { color: var(--primary); border-color: var(--edit-border); background: var(--edit-bg); }
    .btn-del { color: var(--red); border-color: #fecaca; background: #fef2f2; }

    /* 右下角懸浮按鈕 */
    .fab {
      position: fixed;
      bottom: 20px;
      right: 18px;
      background: var(--fab-bg);
      color: var(--fab-text);
      border: none;
      border-radius: 18px;
      padding: 14px 22px;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      cursor: pointer;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* 主題切換提示 */
    .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(31, 41, 55, 0.88);
      color: #fff;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .toast.show { opacity: 1; }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      width: 100%;
      max-width: 520px;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      animation: slideUp 0.2s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal h2 { margin: 0 0 14px; font-size: 18px; }
    .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .form-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .field input {
      width: 100%;
      padding: 10px;
      font-size: 18px;
      font-weight: 600;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      text-align: center;
      background: #fff;
    }
    .field input:disabled { background: #f3f4f6; color: var(--muted); }
    .field input.text-left { text-align: left; font-size: 15px; font-weight: 400; }
    .field input.dt-input { font-size: 15px; font-weight: 500; }
    .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
    .btn-primary, .btn-cancel {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-cancel { background: #f3f4f6; color: var(--text); }
    .text-red { color: var(--red) !important; }
    .text-green { color: var(--green) !important; }
    .empty-tip { text-align: center; color: var(--muted); padding: 24px 0; font-size: 14px; }
  </style>
</head>
<body>

<header>
  <h1>血壓紀錄 <span id="syncStatus" class="sync-badge">讀取中</span></h1>
  <div class="header-actions">
    <button class="icon-btn" onclick="cycleTheme()" title="切換色系">🎨</button>
    <button class="icon-btn" onclick="openSettings()">⚙️ 設定</button>
  </div>
</header>

<div id="toast" class="toast"></div>

<div class="container">
  <!-- 最近 7 日統計資料 -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">7 天平均</div>
      <div id="statAvg" class="stat-val">--/--</div>
      <div id="statAvgSub" class="stat-sub">mmHg</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">7 天最低</div>
      <div id="statMin" class="stat-val">--/--</div>
      <div id="statMinSub" class="stat-sub">尚無紀錄</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">7 天最高</div>
      <div id="statMax" class="stat-val">--/--</div>
      <div id="statMaxSub" class="stat-sub">尚無紀錄</div>
    </div>
  </div>

  <!-- 趨勢折線圖 -->
  <div class="card">
    <div class="chart-header">
      <div id="chartTitle" class="chart-title">7 天趨勢</div>
      <div class="range-btns">
        <button class="range-btn active" onclick="setZoomDays(7, this)">7天</button>
        <button class="range-btn" onclick="setZoomDays(14, this)">14天</button>
        <button class="range-btn" onclick="setZoomDays(30, this)">30天</button>
      </div>
    </div>
    <div id="chart"></div>
  </div>

  <!-- 歷史紀錄列表 -->
  <div class="card">
    <div class="list-header">
      <span class="list-title">歷史紀錄</span>
      <span id="recordCount" style="font-size:12px;color:var(--muted);">0 筆</span>
    </div>
    <div id="recordList"></div>
  </div>
</div>

<button class="fab" onclick="openRecordModal()">＋ 新增紀錄</button>

<!-- 新增 / 編輯視窗 -->
<div id="recordModal" class="modal-backdrop">
  <div class="modal">
    <h2 id="modalTitle">新增紀錄</h2>
    <input type="hidden" id="editId" />
    <div class="form-grid-2">
      <div class="field">
        <label>日期</label>
        <input id="inputDate" type="date" class="dt-input" />
      </div>
      <div class="field">
        <label>時間</label>
        <input id="inputTime" type="time" class="dt-input" />
      </div>
    </div>
    <div class="form-grid">
      <div class="field">
        <label>收縮壓</label>
        <input id="inputSys" type="number" inputmode="numeric" placeholder="120" />
      </div>
      <div class="field">
        <label>舒張壓</label>
        <input id="inputDia" type="number" inputmode="numeric" placeholder="80" />
      </div>
      <div class="field">
        <label>心率</label>
        <input id="inputHr" type="number" inputmode="numeric" placeholder="72" />
      </div>
    </div>
    <div class="field">
      <label>備註（選填，不顯示於折線圖）</label>
      <input id="inputNote" type="text" class="text-left" placeholder="例如：起床量、夜間、有服藥..." />
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('recordModal')">取消</button>
      <button id="saveRecordBtn" class="btn-primary" onclick="saveRecord()">儲存</button>
    </div>
  </div>
</div>

<!-- 設定視窗 -->
<div id="settingsModal" class="modal-backdrop">
  <div class="modal">
    <h2>警戒值與備份設定</h2>
    <div class="form-grid-2">
      <div class="field">
        <label>收縮壓大於（紅色）</label>
        <input id="cfgSysMax" type="number" inputmode="numeric" />
      </div>
      <div class="field">
        <label>收縮壓小於（綠色）</label>
        <input id="cfgSysMin" type="number" inputmode="numeric" />
      </div>
      <div class="field">
        <label>舒張壓大於（紅色）</label>
        <input id="cfgDiaMax" type="number" inputmode="numeric" />
      </div>
      <div class="field">
        <label>舒張壓小於（綠色）</label>
        <input id="cfgDiaMin" type="number" inputmode="numeric" />
      </div>
    </div>
    <button class="btn-cancel" style="width:100%;margin-top:4px;" onclick="exportJSON()">⬇️ 匯出全部紀錄為 JSON 備份</button>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('settingsModal')">取消</button>
      <button class="btn-primary" onclick="saveSettings()">套用設定</button>
    </div>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzlyGc8ZQtteJjvfuZ0xoqRS_1rBj_HBElXefuJjLfJ2KbSCuYw2eJUjwMPt82ke5Ro/exec";

  const STORAGE_KEY = 'bp_records_v1';
  const CONFIG_KEY = 'bp_config_v1';
  const THEME_KEY = 'bp_theme_v1';

  // 四組主題色系（預設為海洋藍）
  const THEMES = {
    blue: {
      name: '海洋藍',
      headerBg: '#1d4ed8',
      bg: '#eff6ff',
      primary: '#2563eb',
      border: '#dbeafe',
      fabBg: '#bfdbfe',
      fabText: '#1e3a8a',
      editBg: '#eff6ff',
      editBorder: '#bfdbfe',
      sysColor: '#2563eb',
      diaColor: '#0891b2',
      sliderFiller: 'rgba(37, 99, 235, 0.18)',
      splitLine: '#eff6ff'
    },
    green: {
      name: '橄欖綠',
      headerBg: '#4a6b35',
      bg: '#f1f5ec',
      primary: '#4a6b35',
      border: '#e5eadf',
      fabBg: '#fad4e2',
      fabText: '#3d222e',
      editBg: '#f4f8ef',
      editBorder: '#cbd9be',
      sysColor: '#4a6b35',
      diaColor: '#2563eb',
      sliderFiller: 'rgba(74, 107, 53, 0.18)',
      splitLine: '#f1f5ec'
    },
    purple: {
      name: '薰衣草紫',
      headerBg: '#6d28d9',
      bg: '#f5f3ff',
      primary: '#7c3aed',
      border: '#ede9fe',
      fabBg: '#ddd6fe',
      fabText: '#4c1d95',
      editBg: '#f5f3ff',
      editBorder: '#ddd6fe',
      sysColor: '#7c3aed',
      diaColor: '#db2777',
      sliderFiller: 'rgba(124, 58, 237, 0.18)',
      splitLine: '#f5f3ff'
    },
    slate: {
      name: '沉穩灰',
      headerBg: '#334155',
      bg: '#f1f5f9',
      primary: '#475569',
      border: '#e2e8f0',
      fabBg: '#cbd5e1',
      fabText: '#0f172a',
      editBg: '#f8fafc',
      editBorder: '#cbd5e1',
      sysColor: '#334155',
      diaColor: '#0f766e',
      sliderFiller: 'rgba(51, 65, 85, 0.18)',
      splitLine: '#f1f5f9'
    }
  };
  const THEME_ORDER = ['blue', 'green', 'purple', 'slate'];

  let currentTheme = localStorage.getItem(THEME_KEY) || 'blue';
  if (!THEMES[currentTheme]) currentTheme = 'blue';

  let records = [];
  let currentZoomDays = 7;
  let toastTimer = null;
  let config = JSON.parse(localStorage.getItem(CONFIG_KEY)) || {
    sysMax: 130,
    sysMin: 90,
    diaMax: 80,
    diaMin: 60
  };

  const chart = echarts.init(document.getElementById('chart'));
  window.addEventListener('resize', () => chart.resize());

  function applyTheme(key, showNotice = false) {
    currentTheme = key;
    const t = THEMES[key];
    const root = document.documentElement.style;
    root.setProperty('--header-bg', t.headerBg);
    root.setProperty('--bg', t.bg);
    root.setProperty('--primary', t.primary);
    root.setProperty('--border', t.border);
    root.setProperty('--fab-bg', t.fabBg);
    root.setProperty('--fab-text', t.fabText);
    root.setProperty('--edit-bg', t.editBg);
    root.setProperty('--edit-border', t.editBorder);
    localStorage.setItem(THEME_KEY, key);

    if (records.length > 0) renderChart();
    if (showNotice) showToast(`主題已切換為：${t.name}`);
  }

  function cycleTheme() {
    const nextIdx = (THEME_ORDER.indexOf(currentTheme) + 1) % THEME_ORDER.length;
    applyTheme(THEME_ORDER[nextIdx], true);
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatDateObj(d) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function getNowFormatted() {
    const now = new Date();
    const date = formatDateObj(now);
    const time = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    const sec = pad(now.getSeconds());
    return { date, time, timestamp: `${date} ${time}:${sec}` };
  }

  function formatShortDateTime(dateStr, timeStr) {
    const [, m, d] = dateStr.split('-');
    return `${Number(m)}月${Number(d)}日 ${timeStr}`;
  }

  function formatListDate(dateStr) {
    const today = formatDateObj(new Date());
    const yestObj = new Date();
    yestObj.setDate(yestObj.getDate() - 1);
    const yesterday = formatDateObj(yestObj);
    if (dateStr === today) return '今天';
    if (dateStr === yesterday) return '昨天';
    const [y, m, d] = dateStr.split('-').map(Number);
    const weekNames = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    const wk = weekNames[new Date(y, m - 1, d).getDay()];
    return `${m}月${d}日 ${wk}`;
  }

  function getValueClass(val, max, min) {
    if (val > max) return 'text-red';
    if (val < min) return 'text-green';
    return '';
  }

  function formatColoredBP(sys, dia) {
    const sysCls = getValueClass(sys, config.sysMax, config.sysMin);
    const diaCls = getValueClass(dia, config.diaMax, config.diaMin);
    return `<span class="${sysCls}">${sys}</span><span style="color:#9ca3af;font-weight:400;">/</span><span class="${diaCls}">${dia}</span>`;
  }

  function setStatus(text) {
    document.getElementById('syncStatus').textContent = text;
  }

  async function init() {
    applyTheme(currentTheme, false);

    const cached = localStorage.getItem(STORAGE_KEY);
    if (cached) {
      records = JSON.parse(cached);
      renderAll();
    }
    if (!GAS_URL) {
      setStatus('本機測試模式');
      renderAll();
      return;
    }
    setStatus('同步中...');
    try {
      const res = await fetch(GAS_URL);
      const json = await res.json();
      if (json.status === 'success') {
        records = json.data;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        setStatus('雲端已同步');
        renderAll();
      } else {
        setStatus('同步失敗');
      }
    } catch (err) {
      console.error(err);
      setStatus('離線快取');
    }
  }

  function renderAll() {
    records.sort((a, b) => a.timestamp.localeCompare(b.timestamp));
    renderSevenDayStats();
    renderChart();
    renderList();
  }

  function renderSevenDayStats() {
    const startObj = new Date();
    startObj.setDate(startObj.getDate() - 6);
    const startDateStr = formatDateObj(startObj);

    const recent = records.filter(r => r.date >= startDateStr);

    const avgEl = document.getElementById('statAvg');
    const avgSub = document.getElementById('statAvgSub');
    const minEl = document.getElementById('statMin');
    const minSub = document.getElementById('statMinSub');
    const maxEl = document.getElementById('statMax');
    const maxSub = document.getElementById('statMaxSub');

    if (recent.length === 0) {
      avgEl.innerHTML = minEl.innerHTML = maxEl.innerHTML = '--/--';
      avgSub.textContent = '近7日無紀錄';
      minSub.textContent = '尚無紀錄';
      maxSub.textContent = '尚無紀錄';
      return;
    }

    const avgSys = Math.round(recent.reduce((s, r) => s + r.sys, 0) / recent.length);
    const avgDia = Math.round(recent.reduce((s, r) => s + r.dia, 0) / recent.length);
    const avgHr = Math.round(recent.reduce((s, r) => s + r.hr, 0) / recent.length);

    let minRec = recent[0];
    let maxRec = recent[0];
    for (const r of recent) {
      if (r.sys < minRec.sys || (r.sys === minRec.sys && r.dia < minRec.dia)) minRec = r;
      if (r.sys > maxRec.sys || (r.sys === maxRec.sys && r.dia > maxRec.dia)) maxRec = r;
    }

    avgEl.innerHTML = formatColoredBP(avgSys, avgDia);
    avgSub.textContent = `${recent.length}筆 · 心率 ${avgHr}`;

    minEl.innerHTML = formatColoredBP(minRec.sys, minRec.dia);
    minSub.textContent = formatShortDateTime(minRec.date, minRec.time);

    maxEl.innerHTML = formatColoredBP(maxRec.sys, maxRec.dia);
    maxSub.textContent = formatShortDateTime(maxRec.date, maxRec.time);
  }

  function renderChart() {
    const total = records.length;
    if (total === 0) {
      chart.clear();
      chart.setOption({
        title: { text: '尚無資料，請點擊右下角按鈕新增', left: 'center', top: 'center', textStyle: { color: '#9ca3af', fontSize: 14, fontWeight: 'normal' } }
      });
      return;
    }

    const t = THEMES[currentTheme];
    const xLabels = records.map(r => {
      const [, m, d] = r.date.split('-');
      return `${Number(m)}/${Number(d)}`;
    });
    const sysData = records.map(r => r.sys);
    const diaData = records.map(r => r.dia);
    const hrData = records.map(r => r.hr);

    const endIdx = total - 1;
    const startIdx = Math.max(0, total - currentZoomDays);

    chart.setOption({
      animationDuration: 280,
      tooltip: {
        trigger: 'axis',
        formatter: params => {
          const idx = params[0].dataIndex;
          const r = records[idx];
          return `
            <div style="font-weight:600;margin-bottom:4px;">${r.date}</div>
            <div style="display:flex;justify-content:space-between;gap:14px;"><span>收縮壓</span><b>${r.sys}</b></div>
            <div style="display:flex;justify-content:space-between;gap:14px;"><span>舒張壓</span><b>${r.dia}</b></div>
            <div style="display:flex;justify-content:space-between;gap:14px;"><span>心率</span><b>${r.hr}</b></div>
          `;
        }
      },
      legend: {
        bottom: 24,
        data: ['收縮壓', '舒張壓', '心率'],
        selected: { '收縮壓': true, '舒張壓': true, '心率': false },
        textStyle: { fontSize: 12, color: '#4b5563' },
        itemWidth: 14,
        itemHeight: 8
      },
      grid: { left: 36, right: 16, top: 24, bottom: 72 },
      xAxis: {
        type: 'category',
        data: xLabels,
        axisLabel: { fontSize: 11, color: '#6b7280' },
        axisLine: { lineStyle: { color: '#d1d5db' } }
      },
      yAxis: {
        type: 'value',
        scale: true,
        min: v => Math.max(30, Math.floor((v.min - 10) / 10) * 10),
        max: v => Math.ceil((v.max + 12) / 10) * 10,
        axisLabel: { fontSize: 11, color: '#6b7280' },
        splitLine: { lineStyle: { color: t.splitLine } }
      },
      visualMap: [
        {
          show: false,
          seriesIndex: 0,
          pieces: [
            { gt: config.sysMax, color: '#dc2626' },
            { gte: config.sysMin, lte: config.sysMax, color: t.sysColor },
            { lt: config.sysMin, color: '#10b981' }
          ]
        },
        {
          show: false,
          seriesIndex: 1,
          pieces: [
            { gt: config.diaMax, color: '#dc2626' },
            { gte: config.diaMin, lte: config.diaMax, color: t.diaColor },
            { lt: config.diaMin, color: '#10b981' }
          ]
        }
      ],
      dataZoom: [
        {
          type: 'inside',
          startValue: startIdx,
          endValue: endIdx,
          minValueSpan: 4,
          maxValueSpan: 29,
          zoomOnMouseWheel: true,
          moveOnMouseMove: true
        },
        {
          type: 'slider',
          height: 16,
          bottom: 2,
          startValue: startIdx,
          endValue: endIdx,
          minValueSpan: 4,
          maxValueSpan: 29,
          showDetail: false,
          borderColor: t.border,
          fillerColor: t.sliderFiller
        }
      ],
      series: [
        {
          name: '收縮壓',
          type: 'line',
          data: sysData,
          smooth: 0.15,
          symbol: 'circle',
          symbolSize: 8,
          itemStyle: { color: t.sysColor },
          lineStyle: { width: 2.5 },
          label: { show: true, position: 'top', fontSize: 12, fontWeight: 600, color: '#1f2937' },
          labelLayout: { hideOverlap: true }
        },
        {
          name: '舒張壓',
          type: 'line',
          data: diaData,
          smooth: 0.15,
          symbol: 'circle',
          symbolSize: 8,
          itemStyle: { color: t.diaColor },
          lineStyle: { width: 2.5 },
          label: { show: true, position: 'top', fontSize: 12, fontWeight: 600, color: '#1f2937' },
          labelLayout: { hideOverlap: true }
        },
        {
          name: '心率',
          type: 'line',
          data: hrData,
          smooth: 0.15,
          symbol: 'circle',
          symbolSize: 5,
          itemStyle: { color: '#9ca3af' },
          lineStyle: { width: 1.5, type: 'dashed', color: '#9ca3af' }
        }
      ]
    }, true);
  }

  function setZoomDays(days, btn) {
    currentZoomDays = days;
    document.getElementById('chartTitle').textContent = `${days} 天趨勢`;
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderChart();
  }

  function getStatusBarClass(r) {
    if (r.sys > config.sysMax || r.dia > config.diaMax) return 'bar-red';
    if (r.sys < config.sysMin || r.dia < config.diaMin) return 'bar-green';
    return 'bar-normal';
  }

  function renderList() {
    const listEl = document.getElementById('recordList');
    document.getElementById('recordCount').textContent = `${records.length} 筆`;
    if (records.length === 0) {
      listEl.innerHTML = '<div class="empty-tip">目前沒有任何血壓紀錄</div>';
      return;
    }
    const reversed = [...records].reverse();
    listEl.innerHTML = reversed.map(r => `
      <div class="record-item">
        <div class="status-bar ${getStatusBarClass(r)}"></div>
        <div class="record-main">
          <div class="record-top">
            <span class="record-date">${formatListDate(r.date)}</span>
            <span class="record-bp">${formatColoredBP(r.sys, r.dia)}<small>mmHg</small></span>
          </div>
          <div class="record-meta">
            <span>🕒 ${r.time}</span>
            <span>❤️ ${r.hr} bpm</span>
          </div>
          ${r.note ? `<div class="record-note">${escapeHtml(r.note)}</div>` : ''}
        </div>
        <div class="record-actions">
          <button class="btn-sm btn-edit" onclick="openRecordModal('${r.id}')">修改</button>
          <button class="btn-sm btn-del" onclick="deleteRecord('${r.id}')">刪除</button>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  function openRecordModal(id = null) {
    const isEdit = Boolean(id);
    document.getElementById('editId').value = id || '';
    document.getElementById('modalTitle').textContent = isEdit ? '修改紀錄' : '新增紀錄';

    if (isEdit) {
      const r = records.find(item => item.id === id);
      if (!r) return;
      document.getElementById('inputDate').value = r.date;
      document.getElementById('inputTime').value = r.time;
      document.getElementById('inputDate').disabled = true;
      document.getElementById('inputTime').disabled = true;
      document.getElementById('inputSys').value = r.sys;
      document.getElementById('inputDia').value = r.dia;
      document.getElementById('inputHr').value = r.hr;
      document.getElementById('inputNote').value = r.note || '';
    } else {
      const now = getNowFormatted();
      document.getElementById('inputDate').value = now.date;
      document.getElementById('inputTime').value = now.time;
      document.getElementById('inputDate').disabled = false;
      document.getElementById('inputTime').disabled = false;
      document.getElementById('inputSys').value = '';
      document.getElementById('inputDia').value = '';
      document.getElementById('inputHr').value = '';
      document.getElementById('inputNote').value = '';
    }
    document.getElementById('recordModal').classList.add('open');
    setTimeout(() => document.getElementById('inputSys').focus(), 150);
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
  }

  async function saveRecord() {
    const id = document.getElementById('editId').value;
    const date = document.getElementById('inputDate').value;
    const time = document.getElementById('inputTime').value;
    const sys = Number(document.getElementById('inputSys').value);
    const dia = Number(document.getElementById('inputDia').value);
    const hr = Number(document.getElementById('inputHr').value);
    const note = document.getElementById('inputNote').value.trim();

    if (!date || !time) {
      alert('請選擇日期與時間');
      return;
    }
    if (!sys || !dia || !hr) {
      alert('請完整輸入收縮壓、舒張壓與心率數值');
      return;
    }

    const btn = document.getElementById('saveRecordBtn');
    btn.disabled = true;
    btn.textContent = '儲存中...';

    let payload;
    if (id) {
      const target = records.find(r => r.id === id);
      const updated = { ...target, sys, dia, hr, note };
      payload = { action: 'update', record: updated };
    } else {
      const sec = pad(new Date().getSeconds());
      const newRec = {
        id: String(Date.now()),
        timestamp: `${date} ${time}:${sec}`,
        date,
        time,
        sys, dia, hr, note
      };
      payload = { action: 'add', record: newRec };
    }

    try {
      if (GAS_URL) {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.status !== 'success') throw new Error(json.message);
        setStatus('雲端已同步');
      }

      if (id) {
        const idx = records.findIndex(r => r.id === id);
        records[idx] = payload.record;
      } else {
        records.push(payload.record);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      renderAll();
      closeModal('recordModal');
    } catch (err) {
      alert('儲存失敗，請確認網路或 GAS 設定：' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '儲存';
    }
  }

  async function deleteRecord(id) {
    if (!confirm('確定要刪除這筆血壓紀錄嗎？')) return;
    try {
      if (GAS_URL) {
        setStatus('刪除中...');
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete', id })
        });
        const json = await res.json();
        if (json.status !== 'success') throw new Error(json.message);
        setStatus('雲端已同步');
      }
      records = records.filter(r => r.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      renderAll();
    } catch (err) {
      alert('刪除失敗：' + err.message);
    }
  }

  function openSettings() {
    document.getElementById('cfgSysMax').value = config.sysMax;
    document.getElementById('cfgSysMin').value = config.sysMin;
    document.getElementById('cfgDiaMax').value = config.diaMax;
    document.getElementById('cfgDiaMin').value = config.diaMin;
    document.getElementById('settingsModal').classList.add('open');
  }

  function saveSettings() {
    const sysMax = Number(document.getElementById('cfgSysMax').value);
    const sysMin = Number(document.getElementById('cfgSysMin').value);
    const diaMax = Number(document.getElementById('cfgDiaMax').value);
    const diaMin = Number(document.getElementById('cfgDiaMin').value);

    if (sysMin >= sysMax || diaMin >= diaMax) {
      alert('下限數值必須小於上限數值');
      return;
    }
    config = { sysMax, sysMin, diaMax, diaMin };
    localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
    renderAll();
    closeModal('settingsModal');
  }

  function exportJSON() {
    const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `blood_pressure_${getNowFormatted().date}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  init();
</script>
</body>
</html>
